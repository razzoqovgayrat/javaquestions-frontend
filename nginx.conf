server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React routing: noma'lum yo'llar index.html ga qaytadi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li fayllar o'zgarmaydi - uzoq keshlash mumkin
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
